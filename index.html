            const seen = new Set();
            return (userList || []).filter(u => {
                if (!u) return false;
                const key = u.id || (u.email ? u.email.toLowerCase() : null);
                if (!key || seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        };

                const reader = new FileReader();

                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400;
                        const MAX_HEIGHT = 400;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                    const response = await fetch('https://tmpfiles.org/api/v1/upload', {

                        body: formData

                        setTimeout(() => {
                            window.location.href = directUrl;
                        }, 500);

                    } else {
                        throw new Error('Gagal mendapatkan response upload dari Tmpfiles.');
                    }
                } catch (err) {

                    alert("Menggunakan metode unduh lokal (API tmpfiles gagal).");

                                                    <h5 className="text-[11px] font-extrabold uppercase tracking-wider text-amber-900 flex items-center">
                                                        <i className="fa-solid fa-triangle-exclamation text-amber-600 mr-1.5"></i>
                                                        Kelemahan (Weaknesses)
                                                    </h5>
                                                    <ul className="space-y-1 text-xs text-slate-700">
                                                        {(activeReport?.aiResult?.swot?.weaknesses || []).map((w, i) => (
                                                            <li key={i} className="flex items-start"><span className="text-amber-600 mr-1.5">•</span><span>{w}</span></li>
                                                        ))}
                                                    </ul>
                                                </div>

                                                <div className="bg-sky-50/60 border border-sky-200/80 rounded-2xl p-4 space-y-2">
                                                    <h5 className="text-[11px] font-extrabold uppercase tracking-wider text-sky-900 flex items-center">
                                                        <i className="fa-solid fa-lightbulb text-sky-600 mr-1.5"></i>
                                                        Peluang Karir/Usaha (Opportunities)
                                                    </h5>
                                                    <ul className="space-y-1 text-xs text-slate-700">
                                                        {(activeReport?.aiResult?.swot?.opportunities || []).map((o, i) => (
                                                            <li key={i} className="flex items-start"><span className="text-sky-600 mr-1.5">•</span><span>{o}</span></li>
                                                        ))}
                                                    </ul>
                                                </div>

                                                <div className="bg-rose-50/60 border border-rose-200/80 rounded-2xl p-4 space-y-2">
                                                    <h5 className="text-[11px] font-extrabold uppercase tracking-wider text-rose-900 flex items-center">
                                                        <i className="fa-solid fa-shield-exclamation text-rose-600 mr-1.5"></i>
                                                        Tantangan Industri (Threats)
                                                    </h5>
                                                    <ul className="space-y-1 text-xs text-slate-700">
                                                        {(activeReport?.aiResult?.swot?.threats || []).map((t, i) => (
                                                            <li key={i} className="flex items-start"><span className="text-rose-600 mr-1.5">•</span><span>{t}</span></li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>

                                        {(activeReport?.aiResult?.criticalGaps || []).length > 0 && (
                                            <div className="bg-red-50/50 border border-red-200/80 rounded-2xl p-4 space-y-2">
                                                <h4 className="text-xs sm:text-sm font-extrabold text-red-950 flex items-center">
                                                    <i className="fa-solid fa-circle-exclamation text-red-600 mr-2"></i>
                                                    5. Indikator Kritis Perlu Perbaikan Segera
                                                </h4>
                                                <ul className="space-y-1.5 text-xs text-slate-700">
                                                    {activeReport.aiResult.criticalGaps.map((cg, i) => (
                                                        <li key={i} className="flex items-start">
                                                            <span className="text-red-500 font-bold mr-1.5">•</span>
                                                            <span>{cg}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}

                                        <div className="space-y-3">
                                            <h4 className="text-xs sm:text-sm font-extrabold text-slate-800 flex items-center">
                                                <i className="fa-solid fa-route text-red-600 mr-2"></i>
                                                6. Rencana Aksi Pengembangan Kompetensi (Learning Roadmap)
                                            </h4>

                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                                {(activeReport?.aiResult?.learningRoadmap || []).map((rm, idx) => (
                                                    <div key={idx} className="bg-white border border-red-100 p-4 rounded-2xl shadow-sm space-y-2 relative overflow-hidden">
                                                        <div className="w-2 h-full bg-red-600 absolute left-0 top-0"></div>
                                                        <span className="text-[10px] font-black uppercase text-red-600 block pl-1">{rm.phase}</span>
                                                        <h5 className="font-bold text-xs text-slate-900 pl-1">{rm.focus}</h5>
                                                        <ul className="space-y-1 text-[11px] text-slate-600 pl-1 pt-1 border-t border-slate-100">
                                                            {(rm.actionItems || []).map((ai, i) => (
                                                                <li key={i} className="flex items-start">
                                                                    <span className="text-red-500 mr-1">•</span>
                                                                    <span>{ai}</span>
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="bg-slate-900 text-white p-5 rounded-3xl space-y-3 border border-red-900/40">
                                            <h4 className="text-xs sm:text-sm font-extrabold flex items-center text-amber-400">
                                                <i className="fa-solid fa-book-bookmark mr-2 text-red-500"></i>
                                                7. Rekomendasi Modul Pembelajaran LKP Terfokus
                                            </h4>
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                                {(activeReport?.aiResult?.recommendedModules || []).map((mod, i) => (
                                                    <div key={i} className="bg-stone-800/90 border border-stone-700 p-3 rounded-2xl text-xs flex items-start space-x-2">
                                                        <span className="w-5 h-5 rounded-lg bg-red-600 text-white font-bold flex items-center justify-center text-[10px] shrink-0 mt-0.5">
                                                            {i + 1}
                                                        </span>
                                                        <span className="font-semibold text-slate-200">{mod}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="pt-6 border-t border-slate-200 grid grid-cols-2 text-xs text-slate-500">
                                            <div>
                                                <p className="font-bold text-slate-700">Assesment Pro System</p>
                                                <p className="text-[10px] mt-0.5">Laporan evaluasi terverifikasi</p>
                                            </div>
                                            <div className="text-right flex flex-col items-end">
                                                <p className="font-bold text-red-900 font-extrabold">
                                                    Evaluator {activeReport?.namaLembaga || activeReport?.identityData?.namaLembaga || 'LKP'}
                                                </p>
                                                <p className="text-[10px] text-red-700 font-bold">
                                                    NPSN: {activeReport?.npsnLembaga || activeReport?.identityData?.npsnLembaga || '-'}
                                                </p>
                                                <p className="text-[10px] text-slate-500 truncate mb-2">{activeReport?.alamatLembaga || activeReport?.identityData?.alamatLembaga || ''}</p>
                                                
                                                {activeReport?.lembagaCap ? (
                                                    <div className="h-20 w-32 flex items-center justify-end relative">
                                                        <img src={activeReport.lembagaCap} alt="Cap Lembaga" className="w-20 h-20 object-contain mix-blend-multiply opacity-80 absolute top-0" style={{ right: '10px' }} />
                                                    </div>
                                                ) : (
                                                    <div className="h-14"></div>
                                                )}

                                                <p className="font-semibold text-slate-800 z-10 relative mt-1">( .......................... )</p>
                                            </div>
                                        </div>

                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer className="bg-white border-t border-slate-200 py-4 text-center text-[11px] text-slate-400 no-print mt-auto">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-1.5">
                            <p>© 2026 Assesment Pro - Center for Transdisciplinary Community Education & Social Transformation (C-TransCEST)</p>
                            <p className="flex items-center">
                                <i className="fa-solid fa-shield-halved text-emerald-500 mr-1"></i> Standar LKP & Sertifikasi Profesi
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
